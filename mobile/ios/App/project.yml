name: App
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
      - path: App/Assets.xcassets
        buildPhase: resources
      - path: App/Base.lproj/LaunchScreen.storyboard
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DP-700 問題道場
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minetoshi.dp700dojo
        PRODUCT_NAME: App
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AppTests
        - AppUITests
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minetoshi.dp700dojo.tests
        SWIFT_VERSION: "5.0"
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minetoshi.dp700dojo.uitests
        SWIFT_VERSION: "5.0"
