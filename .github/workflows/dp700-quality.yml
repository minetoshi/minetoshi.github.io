name: DP700 quality
on:
  pull_request:
    paths: ['dp700/**', 'mobile/**', '.github/workflows/dp700-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dp700/tests/validate.cjs
      - run: node mobile/scripts/audit.cjs
      - run: node mobile/scripts/build-native.cjs
      - run: node mobile/tests/native.cjs
      - run: node mobile/scripts/build.cjs
      - run: pip install pyspark==3.5.3
      - run: python -P dp700/tests/pyspark.py
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/http.log 2>&1 &
          node dp700/tests/browser.cjs > browser-results.json
      - run: |
          python3 -m http.server 8765 > /tmp/http-mobile.log 2>&1 &
          node dp700/tests/mobile.cjs
          node mobile/tests/release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dp700-browser-results
          path: |
            browser-results.json
            browser-screenshots/
  ios-native:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mobile/scripts/build-native.cjs
      - run: node mobile/tests/native.cjs
      - run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: SwiftUI unit tests
        run: |
          simulator_id=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .udid][0]')
          test "$simulator_id" != null
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Debug -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO test
