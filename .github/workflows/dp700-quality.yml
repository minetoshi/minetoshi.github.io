name: DP700 quality
on:
  pull_request:
    paths: ['dp700/**', '.github/workflows/dp700-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dp700/tests/validate.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 > /tmp/http.log 2>&1 &
          node dp700/tests/browser.cjs > browser-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dp700-browser-results
          path: |
            browser-results.json
            browser-screenshots/
